name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (e.g. v0.18.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    # macOS runner, not Ubuntu: the darwin build sets CGO_ENABLED=1 so
    # clipboard paste works (issue #156), and cgo for darwin needs the
    # Apple SDK at link time. Go on macOS still cross-compiles the
    # CGO_ENABLED=0 linux/windows targets, and nfpm runs fine there, so a
    # single job covers every artifact.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # Uncomment after generating an AUR SSH key and adding it as a secret:
          # AUR_KEY: ${{ secrets.AUR_KEY }}
